[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adoverseas"
version = "1.0.2"
description = "Adds users to appropriate groups when webhook is received"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "ozpinbeacon" }, { name = "hydazz" }]
keywords = ["ldap", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = ["requests", "ldap3", "APScheduler", "flask", "sqlalchemy"]

[project.scripts]
ADOverseas = "ADOverseas:main"

[project.urls]
Homepage = "https://github.com/woodleighschool/ADOverseas"
Repository = "https://github.com/woodleighschool/ADOverseas"
Issues = "https://github.com/woodleighschool/ADOverseas/issues"

[tool.setuptools]
py-modules = ["ADOverseas"]
