# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/metabasis/main/metabasis.schema.json
---
version: 2
listen: :8080
metrics_listen: :8081

connections:
  microsoft:
    type: microsoft_graph
    tenant_id: ${MICROSOFT_TENANT_ID}
    client_id: ${MICROSOFT_CLIENT_ID}
    client_secret: ${MICROSOFT_CLIENT_SECRET}

database:
  url: ${DATABASE_URL}

webhooks:
  travel_system:
    path: /webhooks/travel-system
    bearer_token: ${TRAVEL_SYSTEM_WEBHOOK_TOKEN}

identity:
  connection: microsoft
  groups:
    students:
      - ${ENTRA_STUDENTS_GROUP_ID}
    staff:
      - ${ENTRA_STAFF_GROUP_ID}
    block_outside_australia:
      - ${ENTRA_BLOCK_OUTSIDE_AUSTRALIA_GROUP_ID}
    allow_overseas:
      - ${ENTRA_ALLOW_OVERSEAS_GROUP_ID}
    enable_mfa:
      - ${ENTRA_ENABLE_MFA_GROUP_ID}
    force_mfa:
      - ${ENTRA_FORCE_MFA_GROUP_ID}

rules:
  - name: students
    when: '"students" in user.groups'
    states:
      pending:
        present:
          - block_outside_australia
          - enable_mfa
        absent:
          - allow_overseas
          - force_mfa
      active:
        present:
          - allow_overseas
          - enable_mfa
          - force_mfa
        absent:
          - block_outside_australia
      settled:
        present:
          - block_outside_australia
        absent:
          - allow_overseas
          - enable_mfa
          - force_mfa

  - name: staff
    when: '"staff" in user.groups'
    states:
      pending:
        present:
          - block_outside_australia
        absent:
          - allow_overseas
      active:
        present:
          - allow_overseas
          - force_mfa
        absent:
          - block_outside_australia
      settled:
        present:
          - block_outside_australia
        absent:
          - allow_overseas

reconcile:
  poll_interval: 1m
  retry_initial: 30s
  retry_max: 15m
