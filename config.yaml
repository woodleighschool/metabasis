# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/metabasis/main/metabasis.schema.json
---
version: 1

connections:
  microsoft:
    type: microsoft_graph
    tenant_id: ${MICROSOFT_TENANT_ID}
    client_id: ${MICROSOFT_CLIENT_ID}
    client_secret: ${MICROSOFT_CLIENT_SECRET}

database:
  url: ${DATABASE_URL}
  min_connections: 2
  max_connections: 10
  max_connection_lifetime: 30m

webhooks:
  freshservice:
    path: /webhooks/freshservice
    bearer_token: ${FRESHSERVICE_WEBHOOK_TOKEN}

identity:
  connection: microsoft
  groups:
    students:
      - ${ENTRA_STUDENTS_GROUP_ID}
    staff:
      - ${ENTRA_STAFF_GROUP_ID}

managed_groups:
  mfa_registration: ${ENTRA_MFA_REGISTRATION_GROUP_ID}
  overseas_access: ${ENTRA_OVERSEAS_ACCESS_GROUP_ID}
  overseas_mfa: ${ENTRA_OVERSEAS_MFA_GROUP_ID}

rules:
  - name: students
    when: '"students" in user.groups'
    phases:
      pending:
        groups:
          - mfa_registration
      active:
        groups:
          - mfa_registration
          - overseas_access
          - overseas_mfa

  - name: staff
    when: '"staff" in user.groups'
    phases:
      active:
        groups:
          - overseas_access

reconcile:
  poll_interval: 1m
  retry_initial: 30s
  retry_max: 15m
