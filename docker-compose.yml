---
services:
  metabasis:
    image: ghcr.io/woodleighschool/metabasis:rolling
    # Uncomment below to build local source.
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    # pull_policy: build
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://metabasis:metabasis@postgres:5432/metabasis?sslmode=disable
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      FRESHSERVICE_WEBHOOK_TOKEN: ${FRESHSERVICE_WEBHOOK_TOKEN}
      ENTRA_STUDENTS_GROUP_ID: ${ENTRA_STUDENTS_GROUP_ID}
      ENTRA_STAFF_GROUP_ID: ${ENTRA_STAFF_GROUP_ID}
      ENTRA_MFA_REGISTRATION_GROUP_ID: ${ENTRA_MFA_REGISTRATION_GROUP_ID}
      ENTRA_OVERSEAS_ACCESS_GROUP_ID: ${ENTRA_OVERSEAS_ACCESS_GROUP_ID}
      ENTRA_OVERSEAS_MFA_GROUP_ID: ${ENTRA_OVERSEAS_MFA_GROUP_ID}
    ports:
      - "${METABASIS_PORT:-8080}:8080"
    volumes:
      - ./config.yaml:/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: metabasis
      POSTGRES_PASSWORD: metabasis
      POSTGRES_DB: metabasis
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
