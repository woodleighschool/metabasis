monorepo_root = true

[tools]
go = "1.26.6"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"
node = "26.7.0"
pnpm = "11.22.0"
golangci-lint = "2.12.2"
air = "1.67.4"
lefthook = "2.1.10"
actionlint = "1.7.12"
zizmor = "1.29.0"
oxfmt = "0.64.0"
oxlint = "1.78.0"
"npm:@commitlint/cli" = "21.2.2"

[settings]
experimental = true
pin = true
lockfile = true

[monorepo]
config_roots = ["web"]

[tasks.go-deps]
description = "Download Go dependencies"
run = "go mod download"

[tasks.deps]
description = "Install backend and web dependencies"
depends = ["go-deps", "//web:deps"]

[tasks.dev]
description = "Run backend and web development servers"
run = { tasks = ["dev-backend", "//web:dev"] }

[tasks.dev-backend]
description = "Run backend development server"
run = "air"

[tasks.build]
description = "Build web bundle and backend binary"
depends = ["//web:build"]
run = { task = "backend" }

[tasks.backend]
description = "Build backend binary"
run = "go build -o adoverseas ./cmd/server"

[tasks.tidy]
description = "Tidy the Go module"
run = "go mod tidy"

[tasks.tidy-check]
description = "Check the Go module is tidy"
run = "go mod tidy -diff"

[tasks.vulncheck]
description = "Scan for known vulnerabilities with govulncheck"
run = "govulncheck ./..."

[tasks.generate]
description = "Regenerate checked-in SQL code"
run = "go tool sqlc generate -f sqlc.yaml"

[tasks.test]
description = "Run dependency-free Go checks"
run = ["go vet ./...", "go test -race -count=1 ./..."]

[tasks.go-lint]
description = "Run Go linters"
run = "golangci-lint run"

[tasks.go-lint-fix]
description = "Run Go linters and apply fixes"
run = "golangci-lint run --fix"

[tasks.lint-fix]
description = "Run backend and web linters and apply fixes"
depends = ["go-lint-fix", "//web:lint-fix"]

[tasks.lint]
description = "Run backend and web linters"
depends = ["go-lint", "//web:lint"]

[tasks.go-format]
description = "Format Go code"
run = "go fmt ./..."

[tasks.go-fmt-check]
description = "Check Go formatting"
run = "test -z \"$(gofmt -l .)\" || { gofmt -l .; exit 1; }"

[tasks.format]
description = "Format backend and web code"
depends = ["go-format", "//web:format"]

[tasks.fmt-check]
description = "Check backend and web formatting"
depends = ["go-fmt-check", "//web:fmt-check"]

[tasks.workflow-lint]
description = "Lint GitHub Actions workflows"
run = ["actionlint", "zizmor --offline --no-ignores .github/workflows"]

[tasks.clean]
description = "Remove local build outputs"
run = "rm -rf adoverseas .air bin web/dist"

[hooks]
postinstall = "lefthook install"
