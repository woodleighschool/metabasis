version: "2"

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/woodleighschool/adoverseas)
    goimports:
      local-prefixes:
        - github.com/woodleighschool/adoverseas
    golines:
      max-len: 120

linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - exptostd
    - gocritic
    - gosec
    - govet
    - ineffassign
    - makezero
    - modernize
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
    - usestdlibvars
    - whitespace
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - gosec
          - noctx
      - linters:
          - gosec
        text: "G124:"
      - linters:
          - gosec
        text: "G703:"
